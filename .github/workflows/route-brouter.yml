name: Route with BRouter

on:
  push:
    branches: [claude/route-with-brouter-script-6uib9t]
    paths:
      - route_with_brouter.py
      - pest-loop-variant-B.gpx
      - .github/workflows/route-brouter.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair via points BRouter cannot map
        run: |
          python3 - <<'PY'
          import json, math, time, urllib.parse, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          NS = "{http://www.topografix.com/GPX/1/1}"
          UA = {"User-Agent": "pest-loop-route-check/1.0 (github actions)"}

          root = ET.parse("pest-loop-variant-B.gpx").getroot()
          vias = []
          for p in root.iter(NS + "rtept"):
              n, d = p.find(NS + "name"), p.find(NS + "desc")
              lat, lon = float(p.get("lat")), float(p.get("lon"))
              if vias and abs(vias[-1][0] - lat) < 1e-6 and abs(vias[-1][1] - lon) < 1e-6:
                  continue
              vias.append([lat, lon, n.text if n is not None else "", d.text if d is not None else ""])
          print(f"{len(vias)} via points\n")

          def brouter(pair, tries=4):
              """403 'Please, retry later!' is rate limiting, not a routing verdict."""
              url = "https://brouter.de/brouter?" + urllib.parse.urlencode({
                  "lonlats": "|".join(f"{lon:.6f},{lat:.6f}" for lat, lon, *_ in pair),
                  "profile": "trekking", "alternativeidx": "0", "format": "gpx"})
              for attempt in range(tries):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=90) as r:
                          return 200, r.read()[:200]
                  except urllib.error.HTTPError as e:
                      body = e.read()[:300]
                      if e.code in (403, 429, 500, 502, 503) and attempt < tries - 1:
                          wait = 20 * (attempt + 1)
                          print(f"      rate limited (HTTP {e.code}); waiting {wait}s")
                          time.sleep(wait)
                          continue
                      return e.code, body
                  except Exception as e:
                      if attempt < tries - 1:
                          time.sleep(15)
                          continue
                      return 0, str(e).encode()

          def nominatim(q):
              url = "https://nominatim.openstreetmap.org/search?" + urllib.parse.urlencode(
                  {"q": q, "format": "json", "limit": "2"})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      return [(float(h["lat"]), float(h["lon"]), h.get("display_name", "?")[:60]) for h in json.load(r)]
              except Exception as e:
                  print(f"      geocode failed: {e}")
                  return []
              finally:
                  time.sleep(1.1)

          def offsets(lat, lon):
              """A ring of candidates around the original point, nearest first."""
              out = []
              for km in (0.3, 0.6, 1.0, 1.5, 2.5):
                  dlat = km / 111.0
                  dlon = km / (111.0 * math.cos(math.radians(lat)))
                  for name, (a, b) in {
                      "N": (lat + dlat, lon), "E": (lat, lon + dlon),
                      "S": (lat - dlat, lon), "W": (lat, lon - dlon),
                      "NE": (lat + dlat * .7, lon + dlon * .7), "SE": (lat - dlat * .7, lon + dlon * .7),
                      "SW": (lat - dlat * .7, lon - dlon * .7), "NW": (lat + dlat * .7, lon - dlon * .7),
                  }.items():
                      out.append((a, b, f"{km} km {name} of the original"))
              return out

          # probe only the legs, with a polite pause, retrying rate limits
          print("=== probing each leg ===")
          bad_legs = []
          for i in range(len(vias) - 1):
              code, body = brouter([vias[i], vias[i + 1]])
              if code != 200:
                  bad_legs.append(i)
                  print(f"  LEG {i:2d} {vias[i][2]} -> {vias[i+1][2]}: HTTP {code} :: {body.decode('utf-8','replace').strip()}")
              time.sleep(2.5)
          print(f"  {len(bad_legs)} failing legs: {bad_legs}\n")

          # the culprit is the point shared by two consecutive failing legs,
          # or the non-endpoint of a lone failing leg confirmed by elimination
          culprits = sorted({i + 1 for i in bad_legs if i + 1 in {j for j in bad_legs}} |
                            {i for i in bad_legs if i - 1 in bad_legs})
          if not culprits:
              for i in bad_legs:
                  for cand in (i, i + 1):
                      other = i + 1 if cand == i else i
                      probe = vias[cand - 1] if cand > 0 else vias[cand + 1]
                      code, _ = brouter([probe, vias[cand]])
                      time.sleep(2.5)
                      if code != 200 and cand not in culprits:
                          culprits.append(cand)
          print(f"=== unroutable via points: {[vias[c][2] for c in culprits]} ===\n")

          for c in culprits:
              lat, lon, name, desc = vias[c]
              print(f"  {name} at {lat:.5f},{lon:.5f} ({desc or 'no desc'})")
              neighbours = [vias[c - 1]] if c > 0 else []
              if c + 1 < len(vias):
                  neighbours.append(vias[c + 1])

              candidates = []
              if "vasutallomas" in (desc + name).lower() or "liniya" in desc.lower():
                  candidates += [(a, b, f"station: {t}") for a, b, t in nominatim(f"{name} vasútállomás, Hungary")]
              candidates += [(a, b, f"place: {t}") for a, b, t in nominatim(f"{name}, Hungary")]
              candidates += offsets(lat, lon)

              fixed = False
              for a, b, label in candidates:
                  d = math.hypot((a - lat) * 111.0, (b - lon) * 111.0 * math.cos(math.radians(lat)))
                  if d > 5:
                      continue
                  if all(brouter([n, [a, b]])[0] == 200 for n in neighbours):
                      print(f"    -> moved {d:.2f} km to {a:.5f},{b:.5f} ({label})")
                      vias[c][0], vias[c][1] = a, b
                      fixed = True
                      break
                  time.sleep(2.0)
              if not fixed:
                  raise SystemExit(f"could not find a routable position near {name}")

          with open("pest-loop-variant-B-checked.gpx", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<gpx version="1.1" creator="probe" xmlns="http://www.topografix.com/GPX/1/1">\n  <rte>\n')
              for lat, lon, name, desc in vias:
                  f.write(f'    <rtept lat="{lat:.6f}" lon="{lon:.6f}"><name>{name}</name></rtept>\n')
              f.write('  </rte>\n</gpx>\n')
          print(f"\nwrote pest-loop-variant-B-checked.gpx with {len(vias)} via points (none dropped)")
          PY

      - name: Snap the checked skeleton to roads
        run: |
          python3 route_with_brouter.py pest-loop-variant-B-checked.gpx \
            --chunk 5 --pause 5 --out pest-loop-variant-B-routed-trekking.gpx

      - name: Check the track against the skeleton
        run: |
          python3 - <<'PY'
          import math, xml.etree.ElementTree as ET
          NS = "{http://www.topografix.com/GPX/1/1}"

          def pts(path, tag):
              return [(float(p.get("lat")), float(p.get("lon")))
                      for p in ET.parse(path).getroot().iter(NS + tag)]

          def d(a, b):
              (la1, lo1), (la2, lo2) = ((math.radians(x), math.radians(y)) for x, y in (a, b))
              h = math.sin((la2-la1)/2)**2 + math.cos(la1)*math.cos(la2)*math.sin((lo2-lo1)/2)**2
              return 2 * 6371.0 * math.asin(math.sqrt(h))

          track = pts("pest-loop-variant-B-routed-trekking.gpx", "trkpt")
          print(f"track points: {len(track)}")
          print(f"length: {sum(d(track[i-1], track[i]) for i in range(1, len(track))):.1f} km")
          print(f"loop closure (last point to first): {d(track[-1], track[0]) * 1000:.0f} m")

          root = ET.parse("pest-loop-variant-B.gpx").getroot()
          print("\ndistance from each original via point to the track:")
          worst = 0.0
          for p in root.iter(NS + "rtept"):
              v = (float(p.get("lat")), float(p.get("lon")))
              n = p.find(NS + "name")
              near = min(d(v, t) for t in track) * 1000
              worst = max(worst, near)
              flag = "  <-- off route" if near > 500 else ""
              print(f"  {near:7.0f} m  {n.text if n is not None else ''}{flag}")
          print(f"\nworst deviation: {worst:.0f} m")
          PY

      - name: Commit the routed track
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pest-loop-variant-B-routed-trekking.gpx pest-loop-variant-B-checked.gpx
          git commit -m "Route the full loop, keeping every via point [skip ci]"
          git push
