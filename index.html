<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Register — pick your birth date among the planets</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <form class="card" id="register" novalidate>
      <h1>Create account</h1>
      <p class="sub">Sign up the old-fashioned, astronomically-correct way.</p>

      <div class="field">
        <span class="field-label">Birth date</span>

        <!-- Ordinary-looking date field. Hovering it drops open the Solar
             System instead of a calendar; that popup is the only way to set
             the value, so the field itself takes no input. -->
        <div class="date-anchor" id="dateAnchor">
          <div class="datebox" id="dateBox" tabindex="0" role="button"
               aria-haspopup="dialog" aria-expanded="false" aria-controls="picker">
            <span id="dateText">—</span>
            <svg class="cal-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M3 10h18M8 3v4M16 3v4" />
            </svg>
          </div>

          <div class="picker" id="picker" role="dialog" aria-label="Solar system date selector" hidden>
            <button type="button" class="expand" id="expandBtn" title="Full screen" aria-label="Full screen">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6" />
              </svg>
            </button>
            <svg id="sky" viewBox="-320 -320 640 640">
              <defs>
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%"  stop-color="#fff7d6" />
                  <stop offset="35%" stop-color="#ffd451" />
                  <stop offset="75%" stop-color="#ff9b21" />
                  <stop offset="100%" stop-color="#ff6a00" stop-opacity="0.15" />
                </radialGradient>
                <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </radialGradient>
              </defs>
              <g id="stars"></g>
              <g id="orbits"></g>
              <g id="extraOrbits" class="extras"></g>
              <circle id="sun" cx="0" cy="0" r="16" fill="url(#sunGrad)" />
              <circle cx="0" cy="0" r="34" fill="url(#glow)" opacity="0.5" />
              <g id="planets"></g>
              <g id="extras" class="extras"></g>
            </svg>
            <output class="fs-date" id="fsDate">—</output>
          </div>
        </div>

        <input type="hidden" id="dateInput" name="birthdate" />
      </div>

      <button type="submit" class="cta">Register</button>
      <p class="result" id="result" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
